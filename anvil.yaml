    <script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "WebApplication", "@id": "https://fillfox.anvil.app/#app", "name": "Fillfox", "url": "https://fillfox.anvil.app/", "description": "A free form builder: write a form like a document, share a link, see every answer and where people stopped. Logic, quizzes and signatures included.", "image": "https://fillfox.anvil.app/_/theme/og-image.png", "inLanguage": "en", "publisher": {"@id": "https://arkvital.com/#org"}, "keywords": "free form builder, Typeform alternative, Tally alternative, Google Forms alternative, online survey maker, quiz maker, form with logic, form drop-off analytics, embed form on website", "applicationCategory": "BusinessApplication", "operatingSystem": "Any (web browser)", "browserRequirements": "Requires JavaScript and a modern web browser", "featureList": ["20 question types, logic, live calculations and answer piping", "Classic pages or one question at a time", "Quiz scores and endings by score", "File uploads and typed or drawn signatures", "Drop-off per question and unfinished answers", "Six languages, pre-filled links and embeds"], "offers": {"@type": "Offer", "price": "0", "priceCurrency": "CAD"}, "audience": {"@type": "Audience", "audienceType": "Small businesses, clubs, teachers and makers"}}, {"@type": "WebSite", "@id": "https://fillfox.anvil.app/#site", "url": "https://fillfox.anvil.app/", "name": "Fillfox", "publisher": {"@id": "https://arkvital.com/#org"}}, {"@type": "Organization", "@id": "https://arkvital.com/#org", "name": "Arkvital", "url": "https://arkvital.com", "email": "arkvital@outlook.com", "address": {"@type": "PostalAddress", "addressLocality": "Montreal", "addressRegion": "QC", "addressCountry": "CA"}}]}</script>
