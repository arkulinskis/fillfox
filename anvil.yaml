metadata:
  description: 'A free form builder: write a form like a document, share a link, see every answer and where people stopped.
    Logic, quizzes and signatures included.'
  logo_img: asset:icon-512.png
  title: 'Fillfox: a free form builder, like Tally or Typeform'
name: Fillfox
native_deps:
  head_html: "<script src=\"_/theme/legal-kit.js?v=4e8d34d0dd\"></script>\n<!-- seo:start (APP_MAKER/seo: edit seo/apps/fillfox.json\
    \ and run seo.py, not here) -->\n<meta name=\"robots\" content=\"index, follow, max-image-preview:large, max-snippet:-1,\
    \ max-video-preview:-1\">\n<meta name=\"keywords\" content=\"free form builder, Typeform alternative, Tally alternative,\
    \ Google Forms alternative, online survey maker, quiz maker, form with logic, form drop-off analytics, embed form on website\"\
    >\n<meta name=\"author\" content=\"Arkvital\">\n<meta property=\"og:type\" content=\"website\">\n<meta property=\"og:site_name\"\
    \ content=\"Fillfox\">\n<meta property=\"og:title\" content=\"Fillfox: a free form builder, like Tally or Typeform\">\n\
    <meta property=\"og:description\" content=\"A free form builder: write a form like a document, share a link, see every\
    \ answer and where people stopped. Logic, quizzes and signatures included.\">\n<meta property=\"og:locale\" content=\"\
    en_CA\">\n<meta name=\"twitter:card\" content=\"summary\">\n<meta name=\"twitter:title\" content=\"Fillfox: a free form\
    \ builder, like Tally or Typeform\">\n<meta name=\"twitter:description\" content=\"A free form builder: write a form like\
    \ a document, share a link, see every answer and where people stopped. Logic, quizzes and signatures included.\">\n<!--\
    \ seo:end -->\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"\
    theme-color\" content=\"#0a0a0a\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<link rel=\"preconnect\"\
    \ href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link\
    \ href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap\"\
    \ rel=\"stylesheet\">\n<link id=\"ui-favicon\" rel=\"icon\" type=\"image/svg+xml\" href=\"_/theme/icon.svg?v=4c8868f0c1\"\
    >\n<link rel=\"apple-touch-icon\" href=\"_/theme/icon-180.png?v=4c8868f0c1\">\n<script>\n/* Keep our tab icon: Anvil adds\
    \ its own <link rel=\"icon\">, so drop any other icon link. */\n(function () {\n  function keep() {\n    var ours = document.getElementById('ui-favicon');\n\
    \    if (!ours) return;\n    document.querySelectorAll('link[rel~=\"icon\"]').forEach(function (l) { if (l !== ours) l.remove();\
    \ });\n  }\n  keep();\n  document.addEventListener('DOMContentLoaded', keep);\n  window.addEventListener('load', keep);\n\
    })();\n</script>\n\n<!-- Prepsto feedback panel: every \"Submit feedback\" link and button opens it (it is the only feedback\
    \ channel). No floating button, no cookies, nothing loads until it is opened. Codes: APP_MAKER/prepsto-links.json -->\n\
    <script src=\"https://prepsto.com/_/theme/widget.js\" data-prepsto=\"mkr8ttv\" data-button=\"false\" data-label=\"Submit\
    \ feedback\" async></script>\n<link rel=\"stylesheet\" href=\"_/theme/app.css?v=25fbd0bc6b\">\n<script src=\"_/theme/app.js?v=fbea00e681\"\
    ></script>\n"
package_name: Fillfox
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 30
    require_secure_passwords: true
    use_email: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/anvil/email.yml
startup:
  module: Main
  type: form
