    <script src="_/theme/ff.js?v=5f9f1faaf2"></script>
    <script src="_/theme/ffr.js?v=925f953d95"></script>
    <script src="_/theme/ff-results.js?v=b2556cdf24"></script>
    <script src="_/theme/ff-editor.js?v=4ec5214198"></script>
package_name: Fillfox
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 30
    require_secure_passwords: true
    use_email: true
    use_google: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/anvil/email.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
startup:
  module: startup
  type: module
