  <div class="ui-stack">
    <label class="ui-field"><span>Email or exact answer</span>
      <anvil-component type="TextBox" name="text_box" prop:placeholder="person@example.com"></anvil-component>

    <div class="ui-row end">
      <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
      <anvil-component type="Button" name="erase_button" prop:text="Erase" prop:role='["btn", "btn-danger", "btn-solid"]'></anvil-component>
    </div>
  </div>
</div>
